<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>synthmatch 楽譜</title>
<style>
:root { --bg: #f4f4f8; --fg: #14151b; --sub: #555a6e; --accent: #6a4dff; --line: #e2e3eb; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e0f13; --fg: #f3f4f8; --sub: #a9adbd; --accent: #8b6cff; --line: #2c2f3d; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-left, 0px)); }
h1 { font-size: 24px; margin: 0 0 24px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
a { color: var(--accent); font-weight: 700; text-decoration: none; }
span { color: var(--sub); }
</style></head>
<body><main><h1>synthmatch で作った楽譜</h1><ul><li><a href="iron-bible/">アイアンバイブル</a><span>5曲</span></li></ul></main></body></html>
